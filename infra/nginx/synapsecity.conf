# Include this in the public TLS edge that owns synapsecity.sbs.
server {
  listen 443 ssl;
  server_name synapsecity.sbs;
  # Supply certificates in the host edge configuration.
  location / { proxy_pass http://synapsecity-gateway:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
server {
  listen 443 ssl;
  server_name cloud.synapsecity.sbs;
  location / { proxy_pass http://console:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
