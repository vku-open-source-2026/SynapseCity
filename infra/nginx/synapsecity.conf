# Include this in the public TLS edge that owns synapsecity.sbs.
# The edge joins the synapsecity-public-stack Docker network and reaches the
# gateway/console by their stable network aliases. Gateway container port is
# always 8080; the host port (default 8085) is only for local access.
server {
  listen 443 ssl;
  server_name synapsecity.sbs;
  # Supply certificates in the host edge configuration.

  location = /health {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ready {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The gateway enforces the City API namespace boundary before proxying to
  # city-service.
  location = /v1 {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /v1/ {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  # The product root and client-side routes belong to the console.
  location / {
    proxy_pass http://synapsecity-console:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 443 ssl;
  server_name cloud.synapsecity.sbs;
  # Supply certificates in the host edge configuration.

  location = /health {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /ready {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The console uses VITE_BASE_API_URL=/v1, so keep the relative API path on
  # the same origin and send it to the gateway.
  location = /v1 {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /v1/ {
    proxy_pass http://synapsecity-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }

  location / {
    proxy_pass http://synapsecity-console:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
