# mosquitto 2.x: local edge broker for ESP32 devices.
# Devices publish JSON to city/sensors/{sensor_id}/data
#   {"value": 123.4, "timestamp": "2026-11-24T...", "metadata": {...}}
# iot-bridge subscribes and forwards to Tier-2 telemetry ingest (HTTPS).
listener 1883
protocol mqtt
allow_anonymous true
max_packet_size 262144
