# mosquitto 2.x edge broker for ESP32 devices.
# Devices publish JSON to city/sensors/{sensor_id}/data at QoS 1:
#   {"value": 123.4, "timestamp": "2026-11-24T...", "metadata": {...}}
# External devices use the TLS listener on 8883. Port 1883 is internal to the
# Compose network only. Both listeners require credentials and enforce ACLs.
per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous false
password_file /run/secrets/mqtt_password_file
acl_file /run/secrets/mqtt_acl_file
max_qos 1
use_username_as_clientid true

listener 8883
protocol mqtt
allow_anonymous false
password_file /run/secrets/mqtt_password_file
acl_file /run/secrets/mqtt_acl_file
max_qos 1
use_username_as_clientid true
cafile /run/secrets/mqtt_tls_ca_file
certfile /run/secrets/mqtt_tls_cert_file
keyfile /run/secrets/mqtt_tls_key_file
tls_version tlsv1.2

# Persist QoS 1 sessions so the broker can redeliver unacknowledged readings
# after a bridge restart. This volume must be on durable storage in production.
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 10
persistent_client_expiration 30d
max_queued_messages 10000
max_queued_bytes 67108864
max_inflight_messages 20
max_packet_size 262144
