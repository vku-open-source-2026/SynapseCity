name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify pinned Tier-2 SDK
        run: npm run check:release

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Build images
        run: docker compose build

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push images
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          images="synapsecity-city-service synapsecity-gateway synapsecity-console"
          for image in $images; do
            remote="ghcr.io/${OWNER}/${image}"
            docker tag "${image}:latest" "${remote}:${TAG}"
            docker tag "${image}:latest" "${remote}:latest"
            docker tag "${image}:latest" "${remote}:sha-${SHA}"
            docker push "${remote}:${TAG}"
            docker push "${remote}:latest"
            docker push "${remote}:sha-${SHA}"
          done

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            infra/nginx/synapsecity.conf
            vendor/synapsedx-capabilities-0.3.0.tgz
            vendor/synapsedx-capabilities-0.3.0.tgz.sha256
          body: |
            SynapseCity ${{ github.ref_name }}

            Images:
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-city-service:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-gateway:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-console:${{ github.ref_name }}`

            The pinned Tier-2 SDK tarball and checksum are attached.
