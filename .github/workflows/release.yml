name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  SOURCE_COMMIT: ${{ github.sha }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify registry Tier-2 SDK
        run: npm run check:release

      - name: Verify Tier boundary and workflow artifacts
        run: |
          npm run test:tier-boundary
          npm run test:workflow-artifacts
          npm run test:release-contracts

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Test contribution backend
        run: cargo test --locked
        working-directory: apps/contribution-service

      - name: Install independently locked frontend dependencies
        run: |
          npm --prefix apps/contribution-console ci
          npm --prefix mobile ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Check dependency licenses and generate release notices
        run: |
          npm run licenses:check
          npm run licenses:inventory

      - name: Generate CycloneDX SBOMs
        run: npm run sbom:generate

      - name: Build and test contribution frontend
        working-directory: apps/contribution-console
        run: |
          npm run lint
          npm test
          npm run build

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Build images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          SYNAPSECITY_IMAGE_OWNER="$OWNER" SYNAPSECITY_VERSION=latest docker compose build

      - name: Scan runtime images for SBOMs
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          for image in synapsecity-city-service synapsecity-gateway synapsecity-console synapsecity-contribution-service synapsecity-contribution-console synapsecity-iot-bridge synapsecity-iot-mock; do
            docker run --rm -v "$PWD/sbom:/sbom" anchore/syft:latest \
              "docker:ghcr.io/${OWNER}/${image}:latest" \
              -o "spdx-json=/sbom/image-${image}.spdx.json"
          done

      - name: Upload release SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: synapsecity-release-sboms
          path: sbom/
          retention-days: 30

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push images
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          images="synapsecity-city-service synapsecity-gateway synapsecity-console synapsecity-contribution-service synapsecity-contribution-console synapsecity-iot-bridge synapsecity-iot-mock"
          for image in $images; do
            remote="ghcr.io/${OWNER}/${image}"
            docker tag "${remote}:latest" "${remote}:${TAG}"
            docker tag "${remote}:latest" "${remote}:sha-${SHA}"
            docker push "${remote}:${TAG}"
            docker push "${remote}:latest"
            docker push "${remote}:sha-${SHA}"
          done

      - name: Make GHCR packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -uo pipefail
          OWNER="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          for image in synapsecity-city-service synapsecity-gateway synapsecity-console synapsecity-contribution-service synapsecity-contribution-console synapsecity-iot-bridge synapsecity-iot-mock; do
            if ! gh api --method PATCH "/orgs/${OWNER}/packages/container/${image}" -f visibility=public >/dev/null 2>&1; then
              echo "::warning::Could not set ${image} public; set it in GitHub package settings."
            fi
          done

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            infra/nginx/synapsecity.conf
            LICENSE
            NOTICE
            THIRD-PARTY.md
            licenses/
            sbom/
          body: |
            SynapseCity ${{ github.ref_name }}

            Images:
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-city-service:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-gateway:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-console:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-contribution-service:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-contribution-console:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-iot-bridge:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/synapsecity-iot-mock:${{ github.ref_name }}`

            Source commit: `${{ github.sha }}`

            Dependency audits, license inventory, notice bundle, and CycloneDX
            SBOMs are attached. MPL source availability is documented in
            `licenses/SOURCE-OFFER.md` and the rendered image notices.
