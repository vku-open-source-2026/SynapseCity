name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify pinned Tier-2 SDK
        run: npm run check:release

      - name: Build
        run: npm run build
      - name: Validate git-managed workflows
        run: npm run workflows:validate

      - name: Test
        run: npm test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust service and gateway tests
        run: |
          (cd apps/city-service && cargo test --locked)
          (cd apps/gateway && cargo test --locked)
          (cd apps/contribution-service && cargo test --locked)

      - name: Gateway + City per-IP rate-limit end-to-end test
        run: npm run test:gateway-rate-limit:e2e

      - name: Plugin, workflow and public-boundary contracts
        run: |
          npm run plugins:check
          npm run plugins:test
          npm run test:public-only
          npm run test:workflow-artifacts
          npm run test:release-contracts

      - name: Audit all production dependency locks
        run: npm run audit:production

      - name: Check dependency licenses
        run: npm run licenses:check

      - name: Verify frontend notice artifacts
        run: node scripts/check-notice-artifacts.mjs apps/console/dist

      - name: Generate CycloneDX SBOMs for all npm and Cargo locks
        run: npm run sbom:generate

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: synapsecity-sboms
          path: sbom/
          retention-days: 14

      - name: Lint console
        run: npm run lint --workspace=@synapsecity/console

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e --workspace=@synapsecity/console

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Compose config
        run: docker compose config >/dev/null

      - name: Compose build
        run: docker compose build

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0

      - name: Check locked Rust workspaces at the declared MSRV
        run: |
          (cd apps/city-service && cargo check --locked --all-targets)
          (cd apps/gateway && cargo check --locked --all-targets)
          (cd apps/contribution-service && cargo check --locked --all-targets)
