name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify pinned Tier-2 SDK
        run: npm run check:release

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint console
        run: npm run lint --workspace=@synapsecity/console

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e --workspace=@synapsecity/console

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Compose config
        run: docker compose config >/dev/null

      - name: Compose build
        run: docker compose build
