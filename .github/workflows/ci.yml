name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify pinned Tier-2 SDK
        run: npm run check:release

      - name: Build
        run: npm run build
      - name: Validate git-managed workflows
        run: npm run workflows:validate

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: synapsecity-sbom
          path: sbom.cdx.json
          retention-days: 14

      - name: Lint console
        run: npm run lint --workspace=@synapsecity/console

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e --workspace=@synapsecity/console

      - name: Check out the Tier-1 Rust SDK (contribution service path dependency)
        uses: actions/checkout@v4
        with:
          repository: vku-open-source-2026/SynapseOne
          path: SynapseOne

      - name: Stage the sibling SDK path used by Docker
        run: cp -a "${GITHUB_WORKSPACE}/SynapseOne" "${GITHUB_WORKSPACE}/../SynapseOne"

      - name: Prepare compose env
        run: cp .env.example .env

      - name: Compose config
        run: docker compose config >/dev/null

      - name: Compose build
        run: docker compose build
