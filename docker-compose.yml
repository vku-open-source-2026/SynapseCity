services:
  city-service:
    image: ghcr.io/${SYNAPSECITY_IMAGE_OWNER:-vku-open-source-2026}/synapsecity-city-service:${SYNAPSECITY_VERSION:-latest}
    build:
      context: ..
      dockerfile: SynapseCity/apps/city-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Internal container port. It is never published on the host.
      PORT: "8083"
      SYNAPSEDX_BASE_URL: https://synapsedx.sbs
      ALLOW_LOCAL_DEPENDENCIES: "false"
      # Optional HMAC session secret. When unset the service generates an
      # ephemeral secret at startup and logs a warning.
      AUTH_SECRET: ${AUTH_SECRET:-}
    expose: ["8083"]
    networks: [synapsecity]
  gateway:
    image: ghcr.io/${SYNAPSECITY_IMAGE_OWNER:-vku-open-source-2026}/synapsecity-gateway:${SYNAPSECITY_VERSION:-latest}
    build:
      context: ..
      dockerfile: SynapseCity/apps/gateway/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Gateway always listens on 8080 inside the stack; the TLS edge and the
      # console proxy target this container port.
      PORT: "8080"
      CITY_SERVICE_URL: http://city-service:8083
      CONSOLE_URL: http://console:80
      CORS_ORIGIN: https://synapsecity.sbs
    depends_on: [city-service, console]
    ports:
      # Host 8085 is the local/public-stack gateway entry; 8083 stays the
      # private city-service port so the two can never be confused.
      # Loopback only: the public edge is synapseone-nginx (80/443).
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8085}:8080"
    networks:
      synapsecity:
        aliases: [synapsecity-gateway]
  console:
    image: ghcr.io/${SYNAPSECITY_IMAGE_OWNER:-vku-open-source-2026}/synapsecity-console:${SYNAPSECITY_VERSION:-latest}
    build:
      context: ./apps/console
      dockerfile: Dockerfile
      args:
        VITE_BASE_API_URL: /v1
    restart: unless-stopped
    expose: ["80"]
    networks:
      synapsecity:
        aliases: [synapsecity-console]

  # Contribution portal (contribution.synapsecity.sbs). Migrated from the
  # OpenInfra reference implementation; OpenInfra is not a deployment source.
  contribution-service:
    image: ghcr.io/${SYNAPSECITY_IMAGE_OWNER:-vku-open-source-2026}/synapsecity-contribution-service:${SYNAPSECITY_VERSION:-latest}
    build:
      context: ./apps/contribution-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STORAGE_BACKEND: ${CONTRIBUTION_STORAGE_BACKEND:-base}
      SYNAPSEONE_BASE_URL: ${CONTRIBUTION_SYNAPSEONE_BASE_URL:-https://api.synapseone.space}
      SYNAPSEONE_API_KEY: ${CONTRIBUTION_SYNAPSEONE_API_KEY:-}
      SYNC_SHARED_SECRET: ${CONTRIBUTION_SYNC_SHARED_SECRET:-}
      VIETMAP_API_KEY: ${CONTRIBUTION_VIETMAP_API_KEY:-}
      JWT_SECRET_KEY: ${CONTRIBUTION_JWT_SECRET_KEY:-}
      ADMIN_USERNAME: ${CONTRIBUTION_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${CONTRIBUTION_ADMIN_PASSWORD:-}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CONTRIBUTION_CORS_ORIGINS:-https://contribution.synapsecity.sbs}
      BIND_ADDR: 0.0.0.0:8000
      TRUST_PROXY_HEADERS: "true"
    expose: ["8000"]
    networks:
      edge:
        aliases: [contribution-backend]
    security_opt:
      - no-new-privileges:true

  contribution-console:
    image: ghcr.io/${SYNAPSECITY_IMAGE_OWNER:-vku-open-source-2026}/synapsecity-contribution-console:${SYNAPSECITY_VERSION:-latest}
    build:
      context: ./apps/contribution-console
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    expose: ["5173"]
    networks:
      edge:
        aliases: [contribution-frontend]
    security_opt:
      - no-new-privileges:true

networks:
  synapsecity:
    name: synapsecity-public-stack
  edge:
    external: true
    name: synapseone_synapseone-net
